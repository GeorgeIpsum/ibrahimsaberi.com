name: Deploy Wisp server (Cloudflare Worker)

# Deploys services/wisp-server to Cloudflare Workers via wrangler.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   token with the "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
# Optional auth for the deployed Worker (set on the Worker, not here):
#   npx wrangler secret put WISP_TOKEN     # and/or ALLOWED_ORIGINS in wrangler.toml

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/wisp-server/**"
      - ".github/workflows/deploy-wisp.yml"

concurrency:
  group: deploy-wisp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gate the deploy on the worker compiling + the protocol tests passing.
      - run: pnpm -F wisp-server typecheck
      - run: pnpm -F wisp-server test
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/wisp-server
          command: deploy
