packages:
  # `.` makes the root package a workspace member so changesets can version it
  # (whole-site single version; see docs/superpowers/specs/2026-07-06-*.md).
  - .
  - packages/*
  - services/*

ignoredBuiltDependencies:
  - onnxruntime-node # hugging face
  - protobufjs # also hugging face

onlyBuiltDependencies:
  - esbuild
  - msw
  - node-jq
  - sharp

patchedDependencies:
  rehype-code-group: patches/rehype-code-group.patch

ignoreWorkspaceRootCheck: true
